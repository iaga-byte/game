<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квадратный психоз</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: white;
        overflow: hidden;
    }

    #menu {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #111827, #312e81);
        z-index: 10;
        text-align: center;
    }

    h1 {
        font-size: 48px;
        margin: 0 0 10px;
    }

    #menu p {
        color: #cbd5e1;
        font-size: 18px;
        margin-bottom: 30px;
    }

    button {
        border: 0;
        background: #22c55e;
        color: white;
        padding: 15px 35px;
        border-radius: 12px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.15s;
    }

    button:hover {
        transform: scale(1.05);
        background: #16a34a;
    }

    #game {
        width: 100vw;
        height: 100vh;
        position: relative;
    }

    #top {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 30px;
        background: rgba(0,0,0,.3);
        padding: 12px 25px;
        border-radius: 15px;
        font-size: 20px;
        z-index: 2;
    }

    .stat span {
        font-weight: bold;
        color: #4ade80;
    }

    #target {
        position: absolute;
        width: 80px;
        height: 80px;
        background: #ef4444;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 0 25px rgba(239,68,68,.6);
        transition: width .15s, height .15s;
    }

    #timerBar {
        position: absolute;
        top: 75px;
        left: 50%;
        transform: translateX(-50%);
        width: 250px;
        height: 7px;
        background: #374151;
        border-radius: 10px;
        overflow: hidden;
    }

    #timerFill {
        width: 100%;
        height: 100%;
        background: #22c55e;
        transform-origin: left;
    }

    #gameOver {
        position: fixed;
        inset: 0;
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,.75);
        z-index: 5;
    }

    .result {
        text-align: center;
        background: #1f2937;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }

    .result h2 {
        font-size: 40px;
        margin-top: 0;
    }

    #finalScore {
        font-size: 60px;
        color: #4ade80;
        font-weight: bold;
        margin: 20px;
    }

    #record {
        color: #facc15;
        margin-bottom: 25px;
    }
</style>
</head>

<body>

<div id="menu">
    <h1>🟥 Квадратный психоз</h1>
    <p>Нажимай на красный квадрат как можно быстрее!</p>
    <button onclick="startGame()">Начать игру</button>
</div>

<div id="game">

    <div id="top">
        <div class="stat">Очки: <span id="score">0</span></div>
        <div class="stat">Рекорд: <span id="best">0</span></div>
    </div>

    <div id="timerBar">
        <div id="timerFill"></div>
    </div>

    <div id="target"></div>

</div>

<div id="gameOver">
    <div class="result">
        <h2>Игра окончена!</h2>
        <div id="finalScore">0</div>
        <div id="record">🏆 Рекорд!</div>
        <button onclick="startGame()">Играть снова</button>
    </div>
</div>

<script>
    const target = document.getElementById("target");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const timerFill = document.getElementById("timerFill");
    const menu = document.getElementById("menu");
    const gameOver = document.getElementById("gameOver");
    const finalScore = document.getElementById("finalScore");
    const record = document.getElementById("record");

    let score = 0;
    let best = Number(localStorage.getItem("squareBest")) || 0;
    let gameRunning = false;
    let timer;
    let timeLimit = 2000;

    bestElement.textContent = best;

    target.addEventListener("click", hitTarget);

    function startGame() {
        score = 0;
        timeLimit = 2000;
        gameRunning = true;

        scoreElement.textContent = score;
        menu.style.display = "none";
        gameOver.style.display = "none";

        target.style.display = "block";

        moveTarget();
        startTimer();
    }

    function hitTarget() {
        if (!gameRunning) return;

        score++;
        scoreElement.textContent = score;

        // Ускоряем игру
        timeLimit = Math.max(500, 2000 - score * 60);

        // Уменьшаем квадрат
        const size = Math.max(30, 80 - score * 2);
        target.style.width = size + "px";
        target.style.height = size + "px";

        // Меняем цвет
        const colors = [
            "#ef4444",
            "#f97316",
            "#eab308",
            "#22c55e",
            "#06b6d4",
            "#8b5cf6",
            "#ec4899"
        ];

        target.style.background =
            colors[score % colors.length];

        moveTarget();
        startTimer();
    }

    function moveTarget() {
        const size = target.offsetWidth || 80;

        const maxX = window.innerWidth - size;
        const maxY = window.innerHeight - size;

        // Не спавним слишком близко к верхней панели
        const minY = 110;

        const x = Math.random() * maxX;
        const y = minY + Math.random() * (maxY - minY);

        target.style.left = x + "px";
        target.style.top = y + "px";
    }

    function startTimer() {
        clearTimeout(timer);

        timerFill.style.transition = "none";
        timerFill.style.width = "100%";

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                timerFill.style.transition =
                    `width ${timeLimit}ms linear`;
                timerFill.style.width = "0%";
            });
        });

        timer = setTimeout(endGame, timeLimit);
    }

    function endGame() {
        gameRunning = false;
        clearTimeout(timer);

        target.style.display = "none";

        finalScore.textContent = score;

        if (score > best) {
            best = score;
            localStorage.setItem("squareBest", best);
            bestElement.textContent = best;
            record.textContent = "🏆 Новый рекорд!";
        } else {
            record.textContent = `Лучший результат: ${best}`;
        }

        gameOver.style.display = "flex";
    }

    window.addEventListener("resize", () => {
        if (gameRunning) moveTarget();
    });
</script>

</body>
</html>
